name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Data audits
        run: pnpm run --if-present audit:data
      - name: Build
        run: pnpm build
      - name: Bundle size
        run: pnpm size
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Lighthouse
        run: pnpm lighthouse
      - name: Lighthouse summary
        if: always()
        run: node scripts/lh-summary.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            playwright-report
            test-results
            .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
